<!doctype html>
<html lang="de" translate="no" class="notranslate">
<head>
<meta charset="utf-8">
<meta name="google" content="notranslate">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="referrer" content="no-referrer">
<link rel="icon" href="data:,">
<title>Omaclusive</title>
<style>
  html, body { margin: 0; height: 100%; background: #000; color: #fff; font-family: sans-serif; overflow: hidden; }
  button { font: inherit; color: inherit; }
  #rahmen {
    height: 100%;
    box-sizing: border-box;
    display: grid;
    grid-template-columns: 1fr;
    grid-template-rows: 6vh 1fr;
    gap: 0.5vh;
    padding: 0.5vh;
  }
  #leiste { display: flex; align-items: center; justify-content: space-between; min-width: 0; }
  #ebene { flex: 1; font-size: 3.6vh; font-weight: 900; text-align: left; line-height: 1.05; padding-left: 1vw; }
  #setup {
    position: relative;
    overflow: hidden;
    font-size: 2.4vh;
    font-weight: 700;
    color: #ccc;
    background: #222;
    border: 3px solid #888;
    border-radius: 2vh;
    padding: 0.8vh 3vw;
    user-select: none;
    touch-action: none;
    cursor: pointer;
  }
  #setup::before { content: ""; position: absolute; inset: 0; width: 0; background: #ffd400; opacity: 0.6; }
  #setup.h::before { width: 100%; transition: width 3s linear; }
  #setup span { position: relative; }
  body.einrichtung #setup { display: none; }
  #mitte-feld { position: relative; min-height: 0; min-width: 0; display: flex; flex-direction: column; }
  /* Kompakt: kleiner Abstand. Der Rand ringsum lässt Platz für die vergrößerte Wahl-Kachel (1,15x). */
  #paar { flex: 1; min-width: 0; min-height: 0; display: grid; grid-template-columns: 1fr 1fr; gap: 0.8vw; padding: 6.5vh 3.6vw; }
  body.frage #paar { margin-top: 6vh; padding-top: 5.5vh; }
  #satz {
    position: absolute;
    left: 1vh;
    right: 1vh;
    top: 1vh;
    margin: 0;
    text-align: center;
    font-size: 5vh;
    font-weight: 900;
    pointer-events: none;
  }
  .karte {
    box-sizing: border-box;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 0.6vh;
    background: #141414;
    border: 0.7vh solid #f7f4ea;
    box-shadow: inset 0 0 0 0.35vh #141414;
    border-radius: 0;
    user-select: none;
    touch-action: manipulation;
    overflow: hidden;
    padding: 0.2vh;
    transition: transform 0.45s ease, border-width 0.45s ease, border-color 0.45s ease;
    animation: none;
  }
  .karte img { object-fit: contain; width: auto; max-width: 92%; max-height: 74%; }
  .wort { font-weight: 900; text-align: center; line-height: 1.05; font-size: 6vh; padding: 0 1vw; }
  /* markiert (nur im Ein-Knopf-Scan) oder gerade gedrückt */
  .karte.an, .karte.gehalten {
    border-width: 1.5vh;
    border-color: #f7f4ea;
    box-shadow: inset 0 0 0 0.8vh #0c2340;
  }
  /* gewählt: sanft auf 1,15x, dickerer Rahmen dicht an der Kachel. Bleibt so stehen, bis die Eingabe läuft. */
  .karte.gewaehlt {
    transform: scale(1.15);
    z-index: 3;
    position: relative;
    border-width: 1.8vh;
    border-color: #ffd400;
    box-shadow: none;
  }
  /* verworfener Druck (zu schnell): kurzes Aufleuchten */
  .karte.verworfen { border-color: #ffe14a; box-shadow: inset 0 0 0 1.2vh #ffe14a; }
  body.anzeige-bild .wort { position: absolute; width: 1px; height: 1px; overflow: hidden; }
  body.anzeige-text .karte img { display: none; }
  /* Bühne: Bild, Film, Radio oder Erinnerung oben, darunter immer genau zwei (oder bei Erinnerung eine) große Kachel */
  #buehne { display: none; flex: 0 0 auto; height: 56vh; align-items: center; justify-content: center; background: #000; min-height: 0; position: relative; }
  body.buehne #buehne { display: flex; }
  body.buehne #paar { flex: 1 1 0; padding: 5vh 3.6vw; }
  body.buehne .karte img { max-height: 54%; }
  body.buehne .wort { font-size: 5vh; }
  #buehneBild, #buehneVideo { display: none; max-width: 100%; max-height: 100%; object-fit: contain; background: #000; }
  #buehneTon { display: none; }
  body.buehne-bild #buehneBild { display: block; }
  body.buehne-video #buehneVideo { display: block; width: 100%; height: 100%; }
  #buehneText { display: none; text-align: center; font-weight: 900; font-size: 8vh; line-height: 1.1; padding: 0 4vw; color: #ffe14a; }
  #buehneText small { display: block; font-size: 4vh; color: #f7f4ea; margin-bottom: 1.5vh; }
  body.buehne-text #buehneText { display: block; }
  body.buehne-radio #buehneText { display: block; color: #f7f4ea; }
  body.eine-kachel #rechts { display: none; }
  body.eine-kachel #paar { grid-template-columns: 1fr; padding-left: 20vw; padding-right: 20vw; }
  /* Listenseite (Filme): zwei Karten und eine schmale Fußzeile mit "Weiter blättern" und "Zurück" */
  #fuss { display: none; gap: 0.8vw; padding: 0 3.6vw 0.5vh; }
  body.seiten #fuss { display: flex; }
  body.seiten #paar { padding-bottom: 3vh; }
  .fuss-knopf {
    flex: 1; box-sizing: border-box; display: flex; align-items: center; justify-content: center; gap: 1.5vw;
    background: #141414; border: 0.6vh solid #f7f4ea; font-weight: 900; font-size: 4vh; padding: 0.6vh 1vw; min-height: 9vh;
    transition: transform 0.45s ease, border-width 0.45s ease, border-color 0.45s ease; user-select: none; touch-action: manipulation;
  }
  .fuss-knopf img { height: 6vh; width: auto; }
  .fuss-knopf.an, .fuss-knopf.gehalten { border-width: 1.2vh; box-shadow: inset 0 0 0 0.6vh #0c2340; }
  .fuss-knopf.gewaehlt { transform: scale(1.08); border-width: 1.2vh; border-color: #ffd400; position: relative; z-index: 3; box-shadow: none; }
  .fuss-knopf.verworfen { border-color: #ffe14a; box-shadow: inset 0 0 0 1vh #ffe14a; }
  button:focus { outline: none; }
  #hinweis {
    position: absolute;
    inset: 0;
    background: #000;
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 5;
  }
  #hinweis[hidden] { display: none; }
  #hinweis .hinweis-karte { width: 64vw; height: 68vh; background: #0c2340; color: #ffe14a; }
  #hinweis img { max-width: 78%; max-height: 70%; }
  #hinweis .wort { font-size: 5vh; }
  #hinweis.zeit .hinweis-karte { gap: 1.5vh; }
  #hinweis.zeit img { max-height: 26%; }
  #hinweis .zaehler { display: none; width: 80%; align-items: center; gap: 2vh; flex-direction: column; }
  #hinweis.zeit .zaehler { display: flex; }
  #hinweis .zaehler #zahl { font-size: 12vh; font-weight: 900; line-height: 1; color: #ffe14a; }
  #hinweis .balken { width: 100%; height: 4vh; border: 0.5vh solid #ffe14a; box-sizing: border-box; background: #0c2340; }
  #hinweis .balken i { display: block; height: 100%; width: 100%; background: #ffe14a; }
  #selftest { position: absolute; width: 1px; height: 1px; overflow: hidden; }
</style>
</head>
<body class="duo">
<div id="rahmen">
  <div id="leiste">
    <div id="ebene">Start</div>
    <div id="setup" role="button"><span>⚙ Einrichten (3 Sek. halten)</span></div>
  </div>
  <div id="mitte-feld">
    <div id="buehne">
      <img id="buehneBild" alt="" src="data:,">
      <video id="buehneVideo" playsinline></video>
      <audio id="buehneTon"></audio>
      <div id="buehneText"></div>
    </div>
    <div id="paar">
      <button type="button" tabindex="-1" id="links" class="karte"><img alt="" src="img/sagen.svg"><span class="wort">Ich will was sagen</span></button>
      <button type="button" tabindex="-1" id="rechts" class="karte"><img alt="" src="img/andere.svg"><span class="wort">Andere</span></button>
    </div>
    <div id="fuss">
      <button type="button" tabindex="-1" id="fuss-zurueck" class="fuss-knopf"><img alt="" src="img/zurueck.svg"><span class="wort">Zurück</span></button>
      <button type="button" tabindex="-1" id="fuss-blaettern" class="fuss-knopf"><img alt="" src="img/blaettern.svg"><span class="wort">Weiter blättern</span></button>
    </div>
    <p id="satz" hidden></p>
  </div>
</div>
<div id="hinweis" hidden>
  <div class="karte hinweis-karte">
    <img alt="" src="img/zurueck.svg">
    <span class="wort">Gleich zurück</span>
    <div class="zaehler"><span id="zahl" aria-hidden="true"></span><div class="balken"><i id="fuell"></i></div></div>
  </div>
</div>
<div id="selftest"></div>
<script src="sprache.js"></script>
<script src="pfad.js"></script>
<script src="app.js"></script>
</body>
</html>
